[project]
name = "lumiere"
version = "0.1.0"
description = "Derive a HyperFrames video's timing from its narration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henrique Bastos", email = "henrique@bastos.net" }]
requires-python = ">=3.14"
keywords = ["video", "narration", "hyperframes", "timing", "text-to-speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "cmudict>=1.1",
    "numpy>=2.4.6",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/henriquebastos/lumiere"
Repository = "https://github.com/henriquebastos/lumiere"
Issues = "https://github.com/henriquebastos/lumiere/issues"

[project.scripts]
lumiere = "lumiere.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumiere"]

[tool.hatch.build.targets.sdist]
include = ["src/lumiere", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
